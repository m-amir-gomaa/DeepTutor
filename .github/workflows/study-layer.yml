name: Portable study layer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'study/**'
      - 'deeptutor/services/study_bridge.py'
      - '.github/workflows/study-layer.yml'

permissions:
  contents: read

jobs:
  isolated-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: study:.
      DEEPTUTOR_STUDY_CONFIG: /tmp/deeptutor-render-ci/installation.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t deeptutor-study-render:ci study/render-image
      - name: Configure the local immutable image
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,shutil
          image=subprocess.check_output(['docker','image','inspect','--format','{{.Id}}','deeptutor-study-render:ci'],text=True).strip()
          config=pathlib.Path(os.environ['DEEPTUTOR_STUDY_CONFIG'])
          config.parent.mkdir(parents=True)
          config.write_text(json.dumps({'execution':{'backend':'container','image':image},'tools':{'container':shutil.which('docker')}}))
          PY
      - run: python study/render-image/check.py
  apple-silicon-setup:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHONPATH: study:.
      DEEPTUTOR_STUDY_CONFIG: /tmp/deeptutor-study-mac/installation.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 pymupdf==2.0
      - run: python study/platform_setup.py inspect
      - run: python -m unittest discover -s study -p test_platform_setup.py
      # No account authorization, model download, paid compute or M3 GPU claim.
  portable-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPTUTOR_STUDY_CONFIG: /tmp/deeptutor-study-ci/installation.json
      DEEPTUTOR_HOME: /tmp/deeptutor-study-ci/runtime
      PYTHONPATH: study:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/full.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study/package-lock.json
      - run: python -m pip install -r requirements/full.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install -r study/study-runtime-requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: study
      - run: npx playwright install --with-deps chromium
        working-directory: study
      - run: python -m unittest discover -s study -p 'test_*.py'
